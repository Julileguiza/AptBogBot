name: Rastreador Diario de Apartamentos

on:
  schedule:
    - cron: '0 13-23,0-2 * * *'  # Cada hora de 8:00 a.m. a 9:00 p.m. hora Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias y Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Ejecutar scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scraper.py

      - name: Guardar memoria de vistos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vistos.json descartados.json
          git diff --staged --quiet || git commit -m "Actualizar memoria de vistos y descartados"
          git push